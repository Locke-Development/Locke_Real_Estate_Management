" font-family="Arial" font-size="16" font-weight="400" fill="#88a492" letter-spacing="0">▦</text><text x="65" y="359" font-family="Arial" font-size="16" font-weight="400" fill="#b4c8bd" letter-spacing="0">Deadlines &amp; Alerts</text><text x="39" y="422" font-family="Arial" font-size="16" font-weight="400" fill="#88a492" letter-spacing="0">▣</text><text x="65" y="420" font-family="Arial" font-size="16" font-weight="400" fill="#b4c8bd" letter-spacing="0">Documents</text><text x="39" y="483" font-family="Arial" font-size="16" font-weight="400" fill="#88a492" letter-spacing="0">⚙</text><text x="65" y="481" font-family="Arial" font-size="16" font-weight="400" fill="#b4c8bd" letter-spacing="0">Brokerage Admin</text><line x1="24" y1="884" x2="225" y2="884" stroke="#385543" stroke-width="1"/><text x="26" y="917" font-family="Arial" font-size="12" font-weight="700" fill="#d7e8d9" letter-spacing="0">Locke Development</text><line x1="280" y1="69" x2="1496" y2="69" stroke="#e2e5dd" stroke-width="1"/><text x="288" y="42" font-family="Arial" font-size="10" font-weight="700" fill="#7d8a82" letter-spacing="0">LOCKE / REAL ESTATE MANAGEMENT / CONTRACT INTELLIGENCE</text><text x="1320" y="42" font-family="Arial" font-size="10" font-weight="700" fill="#7d8a82" letter-spacing="0">SAMPLE WORKSPACE</text><text x="1460" y="42" font-family="Arial" font-size="10" font-weight="400" fill="#7d8a82" letter-spacing="0">2026</text><text x="288" y="114" font-family="Arial" font-size="11" font-weight="700" fill="#b99358" letter-spacing="2">TRANSACTION INTELLIGENCE</text><text x="288" y="155" font-family="Georgia" font-size="40" font-weight="400" fill="#1e4231" letter-spacing="0">Contract Intelligence</text><text x="288" y="182" font-family="Arial" font-size="15" font-weight="400" fill="#7d8a82" letter-spacing="0">Trace proposed facts and changes back to their source before approval.</text><text x="290" y="218" font-family="Arial" font-size="14" font-weight="700" fill="#10291f" letter-spacing="0">Evidence Review</text><text x="440" y="218" font-family="Arial" font-size="14" font-weight="400" fill="#7d8a82" letter-spacing="0">Extracted Facts</text><text x="582" y="218" font-family="Arial" font-size="14" font-weight="400" fill="#7d8a82" letter-spacing="0">Amendment Comparison</text><line x1="288" y1="232" x2="1488" y2="232" stroke="#e2e5dd" stroke-width="1"/><line x1="288" y1="232" x2="430" y2="232" stroke="#b99358" stroke-width="3"/><rect x="288" y="250" width="1200" height="104" rx="9" fill="#244b37" stroke="none" stroke-width="1"/><text x="312" y="278" font-family="Arial" font-size="12" font-weight="700" fill="#c7d1cb" letter-spacing="0">AMENDMENT NO. 1 · 1107 NORTH CEDAR AVENUE</text><text x="312" y="318" font-family="Georgia" font-size="27" font-weight="400" fill="#fff" letter-spacing="0">One deadline change requires approval.</text><rect x="1294" y="287" width="174" height="26" rx="12" fill="#e6bf93" stroke="none" stroke-width="1"/><text x="1306" y="304" font-family="Arial" font-size="11" font-weight="700" fill="#10291f" letter-spacing="0">UNREVIEWED CHANGE</text><rect x="288" y="380" width="608" height="495" rx="10" fill="#ffffff" stroke="#e2e5dd" stroke-width="1"/><text x="311" y="414" font-family="Arial" font-size="16" font-weight="700" fill="#1e4231" letter-spacing="0">SOURCE DOCUMENT · PAGE 2, SECTION 4</text><rect x="911" y="380" width="577" height="495" rx="10" fill="#ffffff" stroke="#e2e5dd" stroke-width="1"/><text x="934" y="414" font-family="Arial" font-size="16" font-weight="700" fill="#1e4231" letter-spacing="0">DETECTED IMPACT · APPROVAL REQUIRED</text><rect x="316" y="448" width="552" height="300" rx="9" fill="#fbfaf5" stroke="#e2e5dd" stroke-width="1"/><text x="341" y="491" font-family="Arial" font-size="12" font-weight="700" fill="#7d8a82" letter-spacing="0">AMENDMENT NO. 1   ·   EXCERPT / PAGE 2 OF 3</text><text x="342" y="543" font-family="Arial" font-size="15" font-weight="400" fill="#1e4231" letter-spacing="0">The parties agree that the financing contingency</text><text x="342" y="569" font-family="Arial" font-size="15" font-weight="400" fill="#1e4231" letter-spacing="0">period in the Purchase Agreement is hereby</text><text x="342" y="595" font-family="Arial" font-size="15" font-weight="400" fill="#1e4231" letter-spacing="0">modified as follows:</text><rect x="335" y="615" width="505" height="52" rx="3" fill="#fff0bb" stroke="none" stroke-width="1"/><text x="344" y="634" font-family="Arial" font-size="14" font-weight="700" fill="#1e4231" letter-spacing="0">Buyer shall obtain written loan commitment no later</text><text x="344" y="656" font-family="Arial" font-size="14" font-weight="700" fill="#1e4231" letter-spacing="0">than November 26, 2026, at 5:00 p.m. Central Time.</text><text x="342" y="708" font-family="Arial" font-size="14" font-weight="400" fill="#7d8a82" letter-spacing="0">All other terms remain unchanged.</text><rect x="932" y="449" width="534" height="112" rx="7" fill="#fff6e7" stroke="#dfbc81" stroke-width="1"/><text x="951" y="480" font-family="Arial" font-size="13" font-weight="700" fill="#b99358" letter-spacing="0">PROPOSED DEADLINE UPDATE</text><text x="951" y="510" font-family="Arial" font-size="14" font-weight="400" fill="#1e4231" letter-spacing="0">Existing financing deadline differs from amendment.</text><text x="951" y="534" font-family="Arial" font-size="13" font-weight="400" fill="#7d8a82" letter-spacing="0">A reviewer must confirm the operative date.</text><line x1="937" y1="610" x2="1463" y2="610" stroke="#e2e5dd" stroke-width="1"/><text x="947" y="603" font-family="Arial" font-size="13" font-weight="400" fill="#7d8a82" letter-spacing="0">Prior deadline</text><text x="1155" y="603" font-family="Arial" font-size="14" font-weight="700" fill="#1e4231" letter-spacing="0">Nov 24, 2026 · 5:00 PM CT</text><line x1="937" y1="661" x2="1463" y2="661" stroke="#e2e5dd" stroke-width="1"/><text x="947" y="654" font-family="Arial" font-size="13" font-weight="400" fill="#7d8a82" letter-spacing="0">Amended deadline</text><text x="1155" y="654" font-family="Arial" font-size="14" font-weight="700" fill="#1e4231" letter-spacing="0">Nov 26, 2026 · 5:00 PM CT</text><line x1="937" y1="712" x2="1463" y2="712" stroke="#e2e5dd" stroke-width="1"/><text x="947" y="705" font-family="Arial" font-size="13" font-weight="400" fill="#7d8a82" letter-spacing="0">Source</text><text x="1155" y="705" font-family="Arial" font-size="14" font-weight="700" fill="#1e4231" letter-spacing="0">Amendment No. 1 · p. 2, §4</text><line x1="937" y1="763" x2="1463" y2="763" stroke="#e2e5dd" stroke-width="1"/><text x="947" y="756" font-family="Arial" font-size="13" font-weight="400" fill="#7d8a82" letter-spacing="0">Recommended action</text><text x="1155" y="756" font-family="Arial" font-size="14" font-weight="700" fill="#1e4231" letter-spacing="0">Confirm → recalculate → notify</text><rect x="937" y="812" width="226" height="42" rx="8" fill="#244b37" stroke="none" stroke-width="1"/><text x="953" y="840" font-family="Arial" font-size="15" font-weight="700" fill="#fff" letter-spacing="0">Approve proposed change</text><rect x="1177" y="812" width="184" height="42" rx="8" fill="#f7f8f5" stroke="#e2e5dd" stroke-width="1"/><text x="1195" y="840" font-family="Arial" font-size="14" font-weight="700" fill="#1e4231" letter-spacing="0">Request correction</text><rect x="0" y="917" width="1536" height="33" rx="0" fill="#10291f" stroke="none" stroke-width="1"/><text x="28" y="939" font-family="Arial" font-size="14" font-weight="700" fill="#e6dbc3" letter-spacing="1">IN DEVELOPMENT     •     CONCEPT UI WITH SYNTHETIC DATA</text></svg>